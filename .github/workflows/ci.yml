name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CI dependencies
        # Uses requirements-ci.txt (lightweight) instead of requirements.txt
        # because the full file includes torch/sentence-transformers (~2 GB)
        # which is too large for GitHub Actions free runners.
        run: pip install -r requirements-ci.txt

      - name: Run unit tests
        run: python -m pytest tests/unit -v
        continue-on-error: true
